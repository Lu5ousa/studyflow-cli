[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow-cli"
version = "1.0.0"
description = "CLI para organizar estudos e ajudar estudantes com dificuldade de rotina."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Lucas Ferreira de Sousa" }
]
license = { text = "MIT" }
dependencies = []
keywords = ["cli", "estudos", "produtividade", "bootcamp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0"
]

[project.scripts]
studyflow = "studyflow.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
